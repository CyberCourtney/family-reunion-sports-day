AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Family Reunion Sports Day - full application stack (DynamoDB, Lambda,
  API Gateway, Cognito, S3 + CloudFront). Deployed with `aws cloudformation
  package` + `aws cloudformation deploy` - see cloudformation/README.md.

Resources:

  # ---------- DynamoDB ----------

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: playerId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: playerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: teamId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  TeamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Team
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  MatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Match
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  ScoreEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ScoreEvent
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: matchId-index
          KeySchema:
            - AttributeName: matchId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: playerId-index
          KeySchema:
            - AttributeName: playerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Lambda execution role ----------
  # Scoped to only this project's tables + CloudWatch Logs - not
  # account-wide DynamoDB access. Separate from the sports-day-admin
  # IAM user used to deploy this stack.

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: sports-day-dynamodb-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SportsDayTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt PlayersTable.Arn
                  - !Sub "${PlayersTable.Arn}/index/*"
                  - !GetAtt TeamTable.Arn
                  - !Sub "${TeamTable.Arn}/index/*"
                  - !GetAtt MatchTable.Arn
                  - !Sub "${MatchTable.Arn}/index/*"
                  - !GetAtt ScoreEventTable.Arn
                  - !Sub "${ScoreEventTable.Arn}/index/*"
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Lambda functions ----------
  # All 4 share one deployment package (the lambda/ directory) - each
  # function just points its Handler at a different file/export within it.

  AddPlayerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-addPlayer
      Runtime: nodejs22.x
      Handler: addPlayer.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  CreateTeamFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-createTeam
      Runtime: nodejs22.x
      Handler: createTeam.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TEAM_TABLE: !Ref TeamTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  SubmitMatchScoreFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-submitMatchScore
      Runtime: nodejs22.x
      Handler: submitMatchScore.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          MATCH_TABLE: !Ref MatchTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetLeagueTableFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-getLeagueTable
      Runtime: nodejs22.x
      Handler: getLeagueTable.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TEAM_TABLE: !Ref TeamTable
          MATCH_TABLE: !Ref MatchTable
          PLAYERS_TABLE: !Ref PlayersTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetMatchesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-getMatches
      Runtime: nodejs22.x
      Handler: getMatches.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          MATCH_TABLE: !Ref MatchTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Cognito (captain auth) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: sports-day-captains
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        project: family-reunion-sports-day

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: sports-day-frontend
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------- API Gateway ----------

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: sports-day-api
      Description: Family Reunion Sports Day API
      EndpointConfiguration:
        Types:
          - REGIONAL

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: sports-day-cognito-authorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref RestApi
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt UserPool.Arn

  PlayersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: players

  TeamsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: teams

  MatchesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: matches

  LeagueTableResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: league-table

  PlayersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AddPlayerFunction.Arn}/invocations"

  TeamsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeamsResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTeamFunction.Arn}/invocations"

  MatchesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitMatchScoreFunction.Arn}/invocations"

  MatchesGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetMatchesFunction.Arn}/invocations"

  LeagueTableGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LeagueTableResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetLeagueTableFunction.Arn}/invocations"

  # CORS preflight - one MOCK OPTIONS method per resource

  PlayersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  TeamsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeamsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  MatchesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  LeagueTableOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LeagueTableResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda invoke permissions - scoped to this API's ARN, one per route

  AddPlayerApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddPlayerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/players"

  CreateTeamApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateTeamFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/teams"

  SubmitMatchScoreApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitMatchScoreFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/matches"

  GetLeagueTableApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetLeagueTableFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/league-table"

  GetMatchesApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetMatchesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/matches"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PlayersPostMethod
      - PlayersOptionsMethod
      - TeamsPostMethod
      - TeamsOptionsMethod
      - MatchesPostMethod
      - MatchesGetMethod
      - MatchesOptionsMethod
      - LeagueTableGetMethod
      - LeagueTableOptionsMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment

  # ---------- Frontend hosting: S3 (private) + CloudFront (OAC) ----------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: sports-day-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Family Reunion Sports Day frontend
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: sports-day-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: sports-day-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          # Managed "CachingDisabled" policy - deliberate while the
          # frontend is still actively changing; avoids needing a cache
          # invalidation after every deploy. Revisit once CI/CD exists.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          Compress: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}"

Outputs:
  ApiId:
    Description: >-
      API Gateway REST API ID. Used by CI to force a fresh stage
      deployment after any Method/Integration change - CloudFormation
      does not automatically create a new AWS::ApiGateway::Deployment
      just because an underlying route changed, so `prod` can keep
      serving a stale snapshot after a successful stack update unless
      something explicitly redeploys the stage.
    Value: !Ref RestApi

  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CloudFrontDomainName:
    Description: CloudFront distribution domain (the live app URL)
    Value: !Sub "https://${Distribution.DomainName}/"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito App Client ID (used by the frontend)
    Value: !Ref UserPoolClient

  SiteBucketName:
    Description: S3 bucket the frontend is deployed to
    Value: !Ref SiteBucket
