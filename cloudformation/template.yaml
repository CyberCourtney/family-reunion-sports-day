AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Family Reunion Sports Day - full application stack (DynamoDB, Lambda,
  API Gateway, Cognito, S3 + CloudFront, cost Budget). Deployed with
  `aws cloudformation package` + `aws cloudformation deploy` - see
  cloudformation/README.md.

Parameters:

  BudgetNotificationEmail:
    Type: String
    Default: courtney@cybercourtney.uk
    Description: >-
      Email address that receives the monthly cost Budget alerts.

Resources:

  # ---------- DynamoDB ----------

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Players
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Stops the table being deleted by accident, by the console, the CLI
      # or a stack teardown. To delete one on purpose, switch this off
      # first. See docs/dr-runbook.md.
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: playerId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: playerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: teamId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  TeamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Team
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Stops the table being deleted by accident, by the console, the CLI
      # or a stack teardown. To delete one on purpose, switch this off
      # first. See docs/dr-runbook.md.
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  MatchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Match
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Stops the table being deleted by accident, by the console, the CLI
      # or a stack teardown. To delete one on purpose, switch this off
      # first. See docs/dr-runbook.md.
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  ScoreEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ScoreEvent
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Stops the table being deleted by accident, by the console, the CLI
      # or a stack teardown. To delete one on purpose, switch this off
      # first. See docs/dr-runbook.md.
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: playerId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: matchId-index
          KeySchema:
            - AttributeName: matchId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: playerId-index
          KeySchema:
            - AttributeName: playerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Lambda execution roles ----------
  # One role per function, each allowed only the exact DynamoDB actions
  # that function makes, on only the tables it touches, plus writing to
  # its own log group. No shared role, no wildcards. Separate from the
  # sports-day-admin IAM user used to deploy this stack.

  AddPlayerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-addPlayer-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-addPlayer-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-addPlayer"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-addPlayer:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt PlayersTable.Arn
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  CreateTeamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-createTeam-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-createTeam-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-createTeam"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-createTeam:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt TeamTable.Arn
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  SubmitMatchScoreRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-submitMatchScore-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-submitMatchScore-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-submitMatchScore"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-submitMatchScore:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt MatchTable.Arn
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetLeagueTableRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-getLeagueTable-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-getLeagueTable-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getLeagueTable"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getLeagueTable:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TeamTable.Arn
                  - !GetAtt MatchTable.Arn
                  - !GetAtt PlayersTable.Arn
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetMatchesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-getMatches-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-getMatches-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getMatches"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getMatches:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MatchTable.Arn
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetPlayersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-fn-getPlayers-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-getPlayers-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getPlayers"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-getPlayers:*"
              - Sid: TableAccess
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub "${PlayersTable.Arn}/index/teamId-index"
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Lambda functions ----------
  # All 4 share one deployment package (the lambda/ directory) - each
  # function just points its Handler at a different file/export within it.

  AddPlayerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-addPlayer
      Runtime: nodejs22.x
      Handler: addPlayer.handler
      Role: !GetAtt AddPlayerRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  CreateTeamFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-createTeam
      Runtime: nodejs22.x
      Handler: createTeam.handler
      Role: !GetAtt CreateTeamRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TEAM_TABLE: !Ref TeamTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  SubmitMatchScoreFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-submitMatchScore
      Runtime: nodejs22.x
      Handler: submitMatchScore.handler
      Role: !GetAtt SubmitMatchScoreRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          MATCH_TABLE: !Ref MatchTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetLeagueTableFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-getLeagueTable
      Runtime: nodejs22.x
      Handler: getLeagueTable.handler
      Role: !GetAtt GetLeagueTableRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TEAM_TABLE: !Ref TeamTable
          MATCH_TABLE: !Ref MatchTable
          PLAYERS_TABLE: !Ref PlayersTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetMatchesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-getMatches
      Runtime: nodejs22.x
      Handler: getMatches.handler
      Role: !GetAtt GetMatchesRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          MATCH_TABLE: !Ref MatchTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetPlayersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-getPlayers
      Runtime: nodejs22.x
      Handler: getPlayers.handler
      Role: !GetAtt GetPlayersRole.Arn
      Code: ../lambda
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Cognito (captain auth) ----------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: sports-day-captains
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserPoolTags:
        project: family-reunion-sports-day

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: sports-day-frontend
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # The frontend never uses the refresh token (a captain just logs in
      # again after the hour is up), so there's no reason to leave one
      # valid for the 30 day default. 1 day is the shortest practical.
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------- API Gateway ----------

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: sports-day-api
      Description: Family Reunion Sports Day API
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: sports-day-cognito-authorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref RestApi
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt UserPool.Arn

  PlayersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: players

  TeamsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: teams

  MatchesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: matches

  LeagueTableResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: league-table

  PlayersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AddPlayerFunction.Arn}/invocations"

  PlayersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.teamId: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetPlayersFunction.Arn}/invocations"

  TeamsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeamsResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTeamFunction.Arn}/invocations"

  MatchesPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitMatchScoreFunction.Arn}/invocations"

  MatchesGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetMatchesFunction.Arn}/invocations"

  LeagueTableGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LeagueTableResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetLeagueTableFunction.Arn}/invocations"

  # CORS preflight - one MOCK OPTIONS method per resource

  PlayersOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PlayersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  TeamsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref TeamsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  MatchesOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref MatchesResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  LeagueTableOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LeagueTableResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda invoke permissions - scoped to this API's ARN, one per route

  AddPlayerApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddPlayerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/players"

  CreateTeamApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateTeamFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/teams"

  SubmitMatchScoreApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitMatchScoreFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/matches"

  GetLeagueTableApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetLeagueTableFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/league-table"

  GetMatchesApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetMatchesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/matches"

  GetPlayersApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPlayersFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/players"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PlayersPostMethod
      - PlayersGetMethod
      - PlayersOptionsMethod
      - TeamsPostMethod
      - TeamsOptionsMethod
      - MatchesPostMethod
      - MatchesGetMethod
      - MatchesOptionsMethod
      - LeagueTableGetMethod
      - LeagueTableOptionsMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      # Baseline for every route. The remediation Lambda below tightens
      # this during a traffic spike and puts it back afterwards.
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
        # Writes are only ever used by the four captains, so they get a
        # much lower ceiling than the public read routes.
        - ResourcePath: "/players"
          HttpMethod: POST
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        - ResourcePath: "/teams"
          HttpMethod: POST
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        - ResourcePath: "/matches"
          HttpMethod: POST
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  # ---------- Frontend hosting: S3 (private) + CloudFront (OAC) ----------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: sports-day-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Family Reunion Sports Day frontend
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: sports-day-s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: sports-day-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref ShortCachePolicy
          # Managed "SecurityHeadersPolicy": HSTS, no content sniffing,
          # frame protection and a referrer policy on every response.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          Compress: true
        CacheBehaviors:
          # Vite content-hashes everything in /assets/, so these can be
          # cached for a long time. Managed "CachingOptimized" policy.
          - PathPattern: /assets/*
            TargetOriginId: sports-day-s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            Compress: true
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # index.html (and anything else outside /assets/) gets a short TTL, so
  # even if a deploy's invalidation were ever missed, visitors would see
  # the new version within a minute. The hashed files under /assets/ never
  # change under the same name, so those use the long-lived managed policy.
  ShortCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: sports-day-short-ttl
        Comment: Short TTL for index.html and other unhashed files
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}"

  # ---------- Alerting ----------
  # One shared SNS topic for cost and (later) operational alarms - the
  # Budget below publishes to it, and any future CloudWatch alarm
  # (Lambda error rate, API Gateway 5xxs) just adds this same topic as
  # an AlarmAction, no new plumbing needed.

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sports-day-alerts
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  AlertsTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref BudgetNotificationEmail

  # Budgets is a separate service account, so it needs an explicit grant
  # to publish here - CloudWatch alarms don't (same-account principals
  # can publish to a topic they own without one).
  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  # ---------- Cost governance ----------
  # A cheap safety net against unexpected cost from the public write
  # routes - alerts on both actual and forecasted spend, independent of
  # everything else in the stack. Scoped to this project's `project` tag
  # (via CostFilters) so spend on unrelated things in the same AWS
  # account doesn't trigger it - requires the `project` cost allocation
  # tag activated in Billing (one-time, done outside CloudFormation), and
  # every billable resource in this stack actually carrying that tag.

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    DependsOn: AlertsTopicPolicy
    Properties:
      Budget:
        BudgetName: family-reunion-sports-day-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
        CostFilters:
          TagKeyValue:
            - "user:project$family-reunion-sports-day"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic

  # ---------- Monitoring ----------
  # Every alarm publishes to AlertsTopic. Lambda "Errors" only counts
  # unhandled exceptions, and these functions catch their own errors and
  # return a 500 response instead, so those are caught by the API Gateway
  # 5XX alarm, not the Lambda ones. Both are needed.

  AddPlayerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-addPlayer-errors
      AlarmDescription: addPlayer Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AddPlayerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  CreateTeamErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-createTeam-errors
      AlarmDescription: createTeam Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateTeamFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  SubmitMatchScoreErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-submitMatchScore-errors
      AlarmDescription: submitMatchScore Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubmitMatchScoreFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetLeagueTableErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-getLeagueTable-errors
      AlarmDescription: getLeagueTable Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetLeagueTableFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetMatchesErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-getMatches-errors
      AlarmDescription: getMatches Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetMatchesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  GetPlayersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-getPlayers-errors
      AlarmDescription: getPlayers Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetPlayersFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # No FunctionName dimension on purpose: one alarm on the region-wide
  # throttle count instead of six, since throttling is an account-level
  # concurrency limit and not something a single function causes.
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-lambda-throttles
      AlarmDescription: Lambda invocations were throttled in this region
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # The tables are on-demand, so there's no provisioned throughput to
  # alarm against. Throttle events are the signal that matters. Skipping
  # ScoreEvent, nothing reads or writes it yet.
  PlayersReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Players-read-throttles
      AlarmDescription: Players table read requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref PlayersTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  PlayersWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Players-write-throttles
      AlarmDescription: Players table write requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref PlayersTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  TeamReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Team-read-throttles
      AlarmDescription: Team table read requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref TeamTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  TeamWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Team-write-throttles
      AlarmDescription: Team table write requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref TeamTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  MatchReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Match-read-throttles
      AlarmDescription: Match table read requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref MatchTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  MatchWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-Match-write-throttles
      AlarmDescription: Match table write requests were throttled
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref MatchTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-api-5xx
      AlarmDescription: API Gateway returned a 5XX, includes handled errors the Lambda alarms miss
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: sports-day-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # 3000 requests in 5 minutes is about 10 a second sustained. A family
  # tournament never gets near that, so this is either abuse or a bug.
  # This is the alarm the remediation below reacts to.
  ApiTrafficSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sports-day-api-traffic-spike
      AlarmDescription: Unusually high request volume on the API
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiName
          Value: sports-day-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  # ---------- Automated remediation ----------
  # CloudWatch alarms can't invoke a Lambda directly, so EventBridge
  # watches the traffic-spike alarm's state changes and calls this. On
  # ALARM it tightens the API stage's throttling, on OK it puts the
  # normal limits back.

  RemediationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sports-day-remediation-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sports-day-remediation-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-remediateApiTraffic"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sports-day-remediateApiTraffic:*"
              - Sid: UpdateProdStageThrottling
                Effect: Allow
                Action: apigateway:PATCH
                Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${RestApi}/stages/prod"
              - Sid: PublishAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertsTopic
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  RemediationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sports-day-remediateApiTraffic
      Runtime: nodejs22.x
      Handler: remediateApiTraffic.handler
      Role: !GetAtt RemediationRole.Arn
      Code: ../lambda
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          API_ID: !Ref RestApi
          STAGE_NAME: prod
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          NORMAL_RATE_LIMIT: "50"
          NORMAL_BURST_LIMIT: "100"
          CLAMPED_RATE_LIMIT: "5"
          CLAMPED_BURST_LIMIT: "10"
      Tags:
        - Key: project
          Value: family-reunion-sports-day

  TrafficSpikeRemediationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sports-day-traffic-spike-remediation
      Description: Run the remediation Lambda when the traffic-spike alarm changes state
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          alarmName:
            - sports-day-api-traffic-spike
          state:
            value:
              - ALARM
              - OK
      Targets:
        - Id: remediation-lambda
          Arn: !GetAtt RemediationFunction.Arn

  RemediationEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemediationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrafficSpikeRemediationRule.Arn

  # ---------- Dashboard ----------

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: sports-day
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "alarm", "x": 0, "y": 0, "width": 24, "height": 4,
              "properties": {
                "title": "Alarm status",
                "alarms": [
                  "${AddPlayerErrorsAlarm.Arn}",
                  "${CreateTeamErrorsAlarm.Arn}",
                  "${SubmitMatchScoreErrorsAlarm.Arn}",
                  "${GetLeagueTableErrorsAlarm.Arn}",
                  "${GetMatchesErrorsAlarm.Arn}",
                  "${GetPlayersErrorsAlarm.Arn}",
                  "${LambdaThrottlesAlarm.Arn}",
                  "${PlayersReadThrottleAlarm.Arn}",
                  "${PlayersWriteThrottleAlarm.Arn}",
                  "${TeamReadThrottleAlarm.Arn}",
                  "${TeamWriteThrottleAlarm.Arn}",
                  "${MatchReadThrottleAlarm.Arn}",
                  "${MatchWriteThrottleAlarm.Arn}",
                  "${Api5xxAlarm.Arn}",
                  "${ApiTrafficSpikeAlarm.Arn}"
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 4, "width": 12, "height": 6,
              "properties": {
                "title": "API requests, 4XX and 5XX",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "sports-day-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "sports-day-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "sports-day-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 4, "width": 12, "height": 6,
              "properties": {
                "title": "API latency (p95, ms)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "p95", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "sports-day-api", "Stage", "prod"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 10, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda invocations",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AddPlayerFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateTeamFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${SubmitMatchScoreFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetLeagueTableFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetMatchesFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetPlayersFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 10, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors and throttles",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${AddPlayerFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateTeamFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${SubmitMatchScoreFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetLeagueTableFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetMatchesFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetPlayersFunction}"],
                  ["AWS/Lambda", "Throttles"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 16, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB consumed capacity",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${PlayersTable}"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${PlayersTable}"],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${TeamTable}"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${TeamTable}"],
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${MatchTable}"],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${MatchTable}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 16, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB throttle events",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${PlayersTable}"],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${PlayersTable}"],
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${TeamTable}"],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${TeamTable}"],
                  ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${MatchTable}"],
                  ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${MatchTable}"]
                ]
              }
            }
          ]
        }

Outputs:
  AlertsTopicArn:
    Description: >-
      SNS topic for cost and operational alerts. Add this as an
      AlarmAction on any future CloudWatch alarm to reuse the same
      subscription instead of creating a new one.
    Value: !Ref AlertsTopic

  ApiId:
    Description: >-
      API Gateway REST API ID. Used by CI to force a fresh stage
      deployment after any Method/Integration change - CloudFormation
      does not automatically create a new AWS::ApiGateway::Deployment
      just because an underlying route changed, so `prod` can keep
      serving a stale snapshot after a successful stack update unless
      something explicitly redeploys the stage.
    Value: !Ref RestApi

  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  CloudFrontDomainName:
    Description: CloudFront distribution domain (the live app URL)
    Value: !Sub "https://${Distribution.DomainName}/"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito App Client ID (used by the frontend)
    Value: !Ref UserPoolClient

  SiteBucketName:
    Description: S3 bucket the frontend is deployed to
    Value: !Ref SiteBucket
