<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="640" fill="#F8FAFC"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#0F172A">How a request travels</text>
  <text x="40" y="62" font-size="14" fill="#64748B">All in eu-west-2. No VPC, no NAT gateway, no servers to patch. Every hop below is a managed service.</text>

  <!-- lane labels -->
  <text x="330" y="100" font-size="13" font-weight="700" fill="#0369A1" letter-spacing="1">LOADING THE SITE</text>
  <text x="330" y="262" font-size="13" font-weight="700" fill="#B45309" letter-spacing="1">USING THE APP (API CALLS)</text>
  <text x="40" y="492" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">WATCHING IT AND</text>
  <text x="40" y="510" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">REACTING</text>

  <!-- Browser -->
  <g filter="url(#softShadow)">
    <rect x="40" y="215" width="190" height="96" rx="14" fill="#475569"/>
  </g>
  <text x="135" y="257" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Browser</text>
  <text x="135" y="280" font-size="12" fill="#E2E8F0" text-anchor="middle">phone, mostly</text>

  <!-- CloudFront -->
  <g filter="url(#softShadow)">
    <rect x="330" y="112" width="230" height="96" rx="14" fill="#0284C7"/>
  </g>
  <text x="445" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">CloudFront</text>
  <text x="445" y="172" font-size="12" fill="#E0F2FE" text-anchor="middle">HTTPS only, security headers</text>
  <text x="445" y="190" font-size="12" fill="#E0F2FE" text-anchor="middle">cache: 60s html, long for /assets</text>

  <!-- S3 -->
  <g filter="url(#softShadow)">
    <rect x="680" y="112" width="230" height="96" rx="14" fill="#0369A1"/>
  </g>
  <text x="795" y="150" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">S3 (private)</text>
  <text x="795" y="172" font-size="12" fill="#E0F2FE" text-anchor="middle">static site files</text>
  <text x="795" y="190" font-size="12" fill="#E0F2FE" text-anchor="middle">only CloudFront can read it</text>

  <!-- API Gateway -->
  <g filter="url(#softShadow)">
    <rect x="330" y="275" width="230" height="110" rx="14" fill="#D97706"/>
  </g>
  <text x="445" y="310" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">API Gateway</text>
  <text x="445" y="332" font-size="12" fill="#FEF3C7" text-anchor="middle">throttle 50/s (writes 5/s)</text>
  <text x="445" y="350" font-size="12" fill="#FEF3C7" text-anchor="middle">Cognito login needed to POST</text>
  <text x="445" y="368" font-size="12" fill="#FEF3C7" text-anchor="middle">reads are public</text>

  <!-- Lambda -->
  <g filter="url(#softShadow)">
    <rect x="680" y="275" width="230" height="110" rx="14" fill="#EA580C"/>
  </g>
  <text x="795" y="310" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Lambda x6</text>
  <text x="795" y="332" font-size="12" fill="#FFEDD5" text-anchor="middle">outside a VPC, on purpose</text>
  <text x="795" y="350" font-size="12" fill="#FFEDD5" text-anchor="middle">one IAM role each, only the</text>
  <text x="795" y="368" font-size="12" fill="#FFEDD5" text-anchor="middle">DynamoDB actions it needs</text>

  <!-- DynamoDB -->
  <g filter="url(#softShadow)">
    <rect x="1030" y="275" width="230" height="110" rx="14" fill="#2563EB"/>
  </g>
  <text x="1145" y="310" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">DynamoDB</text>
  <text x="1145" y="332" font-size="12" fill="#DBEAFE" text-anchor="middle">4 tables, on-demand</text>
  <text x="1145" y="350" font-size="12" fill="#DBEAFE" text-anchor="middle">point-in-time recovery on</text>
  <text x="1145" y="368" font-size="12" fill="#DBEAFE" text-anchor="middle">reached over TLS + IAM</text>

  <!-- ops row -->
  <g filter="url(#softShadow)">
    <rect x="330" y="440" width="230" height="96" rx="14" fill="#64748B"/>
  </g>
  <text x="445" y="478" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Remediation Lambda</text>
  <text x="445" y="500" font-size="12" fill="#E2E8F0" text-anchor="middle">tightens API throttle to 5/s,</text>
  <text x="445" y="518" font-size="12" fill="#E2E8F0" text-anchor="middle">restores 50/s when calm</text>

  <g filter="url(#softShadow)">
    <rect x="680" y="440" width="230" height="96" rx="14" fill="#64748B"/>
  </g>
  <text x="795" y="478" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">EventBridge</text>
  <text x="795" y="500" font-size="12" fill="#E2E8F0" text-anchor="middle">fires on the traffic-spike</text>
  <text x="795" y="518" font-size="12" fill="#E2E8F0" text-anchor="middle">alarm changing state</text>

  <g filter="url(#softShadow)">
    <rect x="1030" y="440" width="230" height="96" rx="14" fill="#64748B"/>
  </g>
  <text x="1145" y="478" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">CloudWatch</text>
  <text x="1145" y="500" font-size="12" fill="#E2E8F0" text-anchor="middle">15 alarms + dashboard</text>
  <text x="1145" y="518" font-size="12" fill="#E2E8F0" text-anchor="middle">then SNS emails me</text>

  <!-- arrows: browser to the two lanes -->
  <path d="M230,244 L280,244 L280,160 L326,160" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M230,282 L280,282 L280,330 L326,330" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- CloudFront -> S3 -->
  <path d="M560,160 L676,160" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="618" y="150" font-size="12" fill="#475569" text-anchor="middle">signed (OAC)</text>

  <!-- API GW -> Lambda -> DynamoDB -->
  <path d="M560,330 L676,330" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="618" y="320" font-size="12" fill="#475569" text-anchor="middle">invoke</text>
  <path d="M910,330 L1026,330" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="968" y="320" font-size="12" fill="#475569" text-anchor="middle">SDK call</text>

  <!-- ops arrows (dashed) -->
  <path d="M1145,440 L1145,389" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="1155" y="418" font-size="12" fill="#64748B">watches metrics</text>
  <path d="M1026,488 L914,488" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <path d="M676,488 L564,488" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <path d="M445,440 L445,389" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="455" y="418" font-size="12" fill="#64748B">changes throttle</text>

  <text x="40" y="590" font-size="13" fill="#64748B">Solid lines are user traffic. Dashed lines are monitoring and the automatic response. Source of truth: cloudformation/template.yaml.</text>
</svg>
