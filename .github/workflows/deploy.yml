name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudformation/**"
      - "lambda/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  # required to request the OIDC token used by aws-actions/configure-aws-credentials.
  # note: the first two runs here failed AssumeRoleWithWebIdentity - not a
  # propagation delay (that was a wrong first guess) but because GitHub
  # embeds immutable numeric IDs in the OIDC "sub" claim
  # (repo:OWNER@ownerId/REPO@repoId:ref:...) whenever the org or repo has
  # ever been renamed, to stop a stale trust policy being hijacked by a
  # rename. Confirmed via CloudTrail (lookup-events on
  # AssumeRoleWithWebIdentity showed the real claim value) and the IAM
  # role's trust policy updated to match it exactly.
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  STACK_NAME: sports-day
  ARTIFACTS_BUCKET: sports-day-cfn-artifacts-123456789012
  SITE_BUCKET: sports-day-sitebucket-qaduylz8wh7i
  CLOUDFRONT_DISTRIBUTION_ID: E1V898KRV13G43

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/sports-day-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Package CloudFormation template
        run: |
          aws cloudformation package \
            --template-file cloudformation/template.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/packaged.yaml \
            --region "$AWS_REGION"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/packaged.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --tags project=family-reunion-sports-day \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Deploy frontend to S3
        run: |
          aws s3 cp frontend/index.html "s3://$SITE_BUCKET/index.html" \
            --content-type "text/html" \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
