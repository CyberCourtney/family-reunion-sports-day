name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "cloudformation/**"
      - "lambda/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  # required to request the OIDC token used by aws-actions/configure-aws-credentials.
  # note: the first two runs here failed AssumeRoleWithWebIdentity - not a
  # propagation delay (that was a wrong first guess) but because GitHub
  # embeds immutable numeric IDs in the OIDC "sub" claim
  # (repo:OWNER@ownerId/REPO@repoId:ref:...) whenever the org or repo has
  # ever been renamed, to stop a stale trust policy being hijacked by a
  # rename. Confirmed via CloudTrail (lookup-events on
  # AssumeRoleWithWebIdentity showed the real claim value) and the IAM
  # role's trust policy updated to match it exactly.
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  STACK_NAME: sports-day
  SITE_BUCKET: sports-day-sitebucket-qaduylz8wh7i
  CLOUDFRONT_DISTRIBUTION_ID: E1V898KRV13G43

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Account ID lives in a repo secret rather than here, so the
          # account isn't disclosed just by reading this public workflow
          # file - the OIDC trust policy itself is what actually restricts
          # who can assume this role, not keeping the ID out of view.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sports-day-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Package CloudFormation template
        env:
          ARTIFACTS_BUCKET: sports-day-cfn-artifacts-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          aws cloudformation package \
            --template-file cloudformation/template.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/packaged.yaml \
            --region "$AWS_REGION"

      - name: Deploy CloudFormation stack
        env:
          ARTIFACTS_BUCKET: sports-day-cfn-artifacts-${{ secrets.AWS_ACCOUNT_ID }}
        # --s3-bucket is needed once the template passes 51,200 bytes,
        # which is the most CloudFormation takes inline. It uploads the
        # template to the artifacts bucket and deploys from there instead.
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/packaged.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --tags project=family-reunion-sports-day \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Force a fresh API Gateway stage deployment
        # CloudFormation doesn't create a new AWS::ApiGateway::Deployment
        # just because a Method/Integration changed underneath it, so
        # `prod` can keep serving a stale snapshot after a successful
        # stack update. This bit us for real: a CORS fix (adding
        # Authorization to Access-Control-Allow-Headers) deployed
        # successfully but the live stage kept the old headers until a
        # manual `create-deployment` forced it to pick the change up.
        run: |
          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiId'].OutputValue" \
            --output text)
          aws apigateway create-deployment \
            --rest-api-id "$API_ID" \
            --stage-name prod \
            --region "$AWS_REGION"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3
        # --delete keeps the bucket matching dist/ exactly - each build's
        # JS/CSS filenames are content-hashed, so without --delete every
        # past build's assets would just accumulate forever.
        run: |
          aws s3 sync frontend/dist "s3://$SITE_BUCKET" \
            --delete \
            --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
